# Blueprint para Render.com — https://render.com/docs/blueprint-spec
# Un solo Web Service (Python/FastAPI): sirve la UI en / y el API en /api/* (carpeta visualizer/ incluida en el repo).
#
# El grafo vive en grafo_libros/ (versionado). No reingestar en cada build.
# Si el servicio YA existe, Render ignora startCommand/buildCommand de este yaml:
#   Start Command: python -u run_server.py
#   Health Check Path: /health
# hnswlib se recompila sin -march=native (SIGILL 132).
# Para actualizar el grafo: python run_quickstart.py en local y commitea grafo_libros/.

services:
  - type: web
    name: project-isla
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip setuptools wheel && HNSWLIB_NO_NATIVE=1 pip install -r requirements.txt && HNSWLIB_NO_NATIVE=1 pip install --force-reinstall --no-cache-dir --no-binary hnswlib hnswlib
    startCommand: python -u run_server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GRAPH_WORKING_DIR
        value: ./grafo_libros
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CONCURRENT_TASK_LIMIT
        value: "2"
      - key: HNSWLIB_NO_NATIVE
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"

